name: Build Stick2Cursor LE
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Get SKSE LE 1.7.3 sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'skse.7z'
          Invoke-WebRequest 'https://skse.silverlock.org/beta/skse_1_07_03.7z' -OutFile $archive -UserAgent 'Mozilla/5.0'
          & 'C:\Program Files\7-Zip\7z.exe' x $archive "-o$env:GITHUB_WORKSPACE\skse_src" -y | Out-Null
          $root = $null
          foreach ($header in Get-ChildItem "$env:GITHUB_WORKSPACE\skse_src" -Recurse -Filter IPrefix.h) {
            $candidate = $header.Directory.Parent.Parent.FullName
            if (Test-Path "$candidate\src\skse\skse\PluginAPI.h") { $root = $candidate; break }
          }
          if (-not $root) { throw 'Could not locate SKSE 1.7.3 source root.' }
          "SKSE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          $props = Join-Path $root 'config\_Plugins.props'
          if (-not (Test-Path $props)) {
            New-Item -ItemType Directory -Force (Split-Path $props) | Out-Null
            Set-Content $props '<?xml version="1.0" encoding="utf-8"?><Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003"></Project>'
          }
      - name: Build common_vc9
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commonDir = Join-Path $env:SKSE_ROOT 'src\common'
          $project = Join-Path $commonDir 'common_vc9.vcxproj'
          $files = Get-ChildItem $commonDir -Filter '*.cpp' | Sort-Object Name
          if (-not $files) { throw 'No SKSE common .cpp files found.' }
          $items = ($files | ForEach-Object { '    <ClCompile Include="' + $_.Name + '" />' }) -join "`r`n"
          $xml = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Project DefaultTargets="Build" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <ItemGroup Label="ProjectConfigurations"><ProjectConfiguration Include="Release|Win32"><Configuration>Release</Configuration><Platform>Win32</Platform></ProjectConfiguration></ItemGroup>
            <PropertyGroup Label="Globals"><ProjectGuid>{DB3AF8F2-6257-47E7-8979-93A4A884A42D}</ProjectGuid><Keyword>Win32Proj</Keyword></PropertyGroup>
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.Default.props" />
            <PropertyGroup Condition="'$(Configuration)|$(Platform)'=='Release|Win32'" Label="Configuration"><ConfigurationType>StaticLibrary</ConfigurationType><UseDebugLibraries>false</UseDebugLibraries><PlatformToolset>v143</PlatformToolset><CharacterSet>MultiByte</CharacterSet></PropertyGroup>
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.props" />
            <PropertyGroup><OutDir>$(MSBuildProjectDirectory)\Release\</OutDir><IntDir>$(MSBuildProjectDirectory)\Release\obj\</IntDir><TargetName>common_vc9</TargetName></PropertyGroup>
            <ItemDefinitionGroup><ClCompile><WarningLevel>Level3</WarningLevel><Optimization>MaxSpeed</Optimization><PreprocessorDefinitions>WIN32;NDEBUG;_LIB;%(PreprocessorDefinitions)</PreprocessorDefinitions><RuntimeLibrary>MultiThreaded</RuntimeLibrary><LanguageStandard>stdcpp14</LanguageStandard><AdditionalIncludeDirectories>$(MSBuildProjectDirectory);%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories></ClCompile></ItemDefinitionGroup>
            <ItemGroup>
          $items
            </ItemGroup>
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.targets" />
          </Project>
          "@
          Set-Content -Path $project -Value $xml -Encoding utf8
          $prefix = Join-Path $commonDir 'IPrefix.h'
          if (-not (Select-String -Path $prefix -Pattern 'STICK2CURSOR_STD_COMPAT' -Quiet)) {
            Add-Content -Path $prefix -Value @('', '// STICK2CURSOR_STD_COMPAT: standard headers expected by the legacy SKSE source', '#ifdef __cplusplus', '#include <string>', '#include <vector>', '#include <map>', '#include <set>', '#include <list>', '#include <algorithm>', '#include <memory>', '#include <cstdint>', '#include <cstddef>', '#include <cstring>', '#include <cstdio>', '#include <cstdlib>', '#include <cmath>', '#endif')
          }
          msbuild $project /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143
          if ($LASTEXITCODE -ne 0) { throw 'common_vc9 build failed.' }
      - name: Build plugin
        shell: pwsh
        run: |
          msbuild src\Stick2CursorLE.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143
          if ($LASTEXITCODE -ne 0) { throw 'Stick2CursorLE build failed.' }
      - name: Upload plugin and source package
        uses: actions/upload-artifact@v4
        with:
          name: Stick2CursorLE-build
          path: |
            out/Stick2CursorLE.dll
            dist/**
            papyrus/src/**
